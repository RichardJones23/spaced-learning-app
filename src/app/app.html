<nav>
  <div class="h-24 min-w-full bg-blue-600 py-4 px-2 flex items-center">
    <h1 class="text-white text-6xl">Spaced</h1>
    <h2 class="text-white text-3xl align-baseline relative top-2.5">Learn</h2>
  </div>
</nav>

<form
  [formGroup]="form"
  (ngSubmit)="addTopic()"
  class="max-w-md mx-auto space-y-4 p-6"
>
  <input
    type="text"
    placeholder="Topic"
    formControlName="topic"
    class="w-full rounded-lg border border-gray-300 px-4 py-2
           outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
  />

  <input
    type="date"
    formControlName="date"
    class="w-full rounded-lg border border-gray-300 px-4 py-2
           outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
  />

  <button
    type="submit"
    class="w-full rounded-lg bg-blue-600 px-4 py-2
           font-medium text-white hover:bg-blue-700
           disabled:bg-gray-300
           disabled:text-gray-500"
           [disabled]="form.invalid"
  >
    SUBMIT
  </button>
</form>

<div class="flex justify-center">
  @if(resultTopics().length!==0){
    <div class="topic min-w-3/4 min-h-12">
      @for (item of resultTopics(); track item) {
        <div class="block bg-blue-600 min-w-1/2 min-h-12 transition duration-200ms ease-in-out 
        hover:bg-blue-900 rounded-md px-4 py-2 my-4 text-white" >
          <p class="font-bold text-lg">{{ item.topic}}</p>
          <p class="date text-sm font-mono">last visited on : {{ item.last_visited_date | date: 'medium'}}</p>
        </div>
      } 
    </div>
  }
</div>
